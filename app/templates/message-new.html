{% extends "authenticated-base.html" %}
{% block title %}New message | AlumCircle{% endblock %}

{% block subpage_content %}
<main class="message-form-page container-fluid py-2">
  <a class="message-back-link" href="{{ url_for('messages_view') }}">Back to inbox</a>
  <h1 class="h3 mt-3">New message</h1>
  {% if recipients %}
  <form class="message-compose-form" method="post" action="{{ url_for('send_new_message') }}">
    <label class="form-label" for="recipient">To</label>
    <select class="form-select mb-3" id="recipient" name="profile_id" required>
      {% for profile in recipients %}
      <option value="{{ profile.id }}">{{ profile.user.name }}{% if profile.headline %} · {{ profile.headline }}{% endif %}</option>
      {% endfor %}
    </select>
    <label class="form-label" for="new-message-body">Message</label>
    <textarea class="form-control mb-3" id="new-message-body" name="body" rows="7" required></textarea>
    <button class="btn btn-primary" type="submit">Send message</button>
  </form>
  {% else %}
  <p class="text-muted">There are no other alumni profiles available to message.</p>
  {% endif %}
</main>
{% endblock %}
